# Guarded bootstrap for the dedicated AuraOS Supabase database.
name: AuraOS database bootstrap

on:
  workflow_dispatch:
  push:
    branches: ["development/auraos-preview"]
    paths:
      - ".github/workflows/auraos-db-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: auraos-database-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.AURAOS_DATABASE_URL }}
      AURAOS_SUPER_ADMIN_PASSWORD: ${{ secrets.AURAOS_SUPER_ADMIN_PASSWORD }}
      AURAOS_EXPECTED_PROJECT_REF: limpprtlwtlvfwezkulq

    steps:
      - name: Checkout isolated AuraOS branch
        uses: actions/checkout@v4
        with:
          ref: development/auraos-preview

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auraos/package-lock.json

      - name: Install AuraOS backend dependencies
        working-directory: auraos
        run: npm ci --no-audit --no-fund

      - name: Fail closed if database identity or schema is unexpected
        working-directory: auraos
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { Pool } = require('pg');
          const expected = process.env.AURAOS_EXPECTED_PROJECT_REF;
          const raw = process.env.DATABASE_URL;
          if (!raw) throw new Error('AURAOS_DATABASE_URL secret is missing');
          const u = new URL(raw);
          const identity = `${u.hostname} ${decodeURIComponent(u.username)}`;
          if (!identity.includes(expected)) throw new Error(`DATABASE IDENTITY MISMATCH: expected ${expected}`);
          u.searchParams.set('sslmode', 'require');
          if (u.hostname.endsWith('.pooler.supabase.com')) u.searchParams.set('uselibpqcompat', 'true');
          const pool = new Pool({ connectionString: u.toString(), connectionTimeoutMillis: 10000 });
          (async () => {
            const client = await pool.connect();
            try {
              const tables = await client.query(`select tablename from pg_tables where schemaname='public' order by tablename`);
              const names = tables.rows.map(r => r.tablename);
              if (names.length > 0 && !names.includes('migrations_log')) throw new Error('Refusing bootstrap: database is not an AuraOS schema');
              console.log(`Preflight passed for dedicated AuraOS database; public tables: ${names.length}`);
            } finally { client.release(); await pool.end(); }
          })().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Compile AuraOS backend before database write
        working-directory: auraos
        run: npm run build

      - name: Apply all AuraOS migrations
        working-directory: auraos
        run: npm run migrate

      - name: Verify migrations, tenant role, and RLS
        working-directory: auraos
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { Pool } = require('pg');
          const fs = require('fs');
          const u = new URL(process.env.DATABASE_URL);
          u.searchParams.set('sslmode', 'require');
          if (u.hostname.endsWith('.pooler.supabase.com')) u.searchParams.set('uselibpqcompat', 'true');
          const pool = new Pool({ connectionString: u.toString(), connectionTimeoutMillis: 10000 });
          (async () => {
            const client = await pool.connect();
            try {
              const expectedFiles = fs.readdirSync('migrations').filter(f => f.endsWith('.sql')).sort();
              const applied = await client.query(`select migration_name from migrations_log order by migration_name`);
              const appliedNames = applied.rows.map(r => r.migration_name);
              const missing = expectedFiles.filter(x => !appliedNames.includes(x));
              if (expectedFiles.length < 29 || missing.length) throw new Error(`Migration verification failed: ${missing.join(', ')}`);
              const role = await client.query(`select rolcanlogin, rolbypassrls from pg_roles where rolname='app_tenant'`);
              if (role.rowCount !== 1 || role.rows[0].rolcanlogin || role.rows[0].rolbypassrls) throw new Error('app_tenant role is not fail-closed');
              const rls = await client.query(`
                select c.table_name, pc.relrowsecurity
                from information_schema.columns c
                join pg_class pc on pc.relname=c.table_name
                join pg_namespace pn on pn.oid=pc.relnamespace and pn.nspname=c.table_schema
                where c.table_schema='public' and c.column_name='restaurant_id' and pc.relkind='r'
              `);
              const unprotected = rls.rows.filter(r => !r.relrowsecurity).map(r => r.table_name);
              if (unprotected.length) throw new Error(`RLS disabled: ${unprotected.join(', ')}`);
              console.log(`${appliedNames.length}/${expectedFiles.length} migrations and tenant RLS verified`);
            } finally { client.release(); await pool.end(); }
          })().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Bootstrap Sayed platform super admin account
        working-directory: auraos
        run: node scripts/bootstrap-super-admin.cjs
