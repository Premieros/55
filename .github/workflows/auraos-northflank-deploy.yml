name: Deploy AuraOS backend to Northflank

# AuraOS preview now runs its AI analytics locally in the frontend.
# Keep this legacy external deployment workflow manual-only so normal preview
# pushes do not fail when Northflank billing is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled-by-default:
    runs-on: ubuntu-latest
    steps:
      - name: External deployment disabled for local AI mode
        run: |
          echo "AuraOS AI is configured for local browser analytics."
          echo "No Northflank deployment is required."
