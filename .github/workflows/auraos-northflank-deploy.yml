name: Deploy AuraOS backend to Northflank

on:
  push:
    branches: ["development/auraos-preview"]
    paths:
      - "auraos/**"
      - ".github/workflows/auraos-northflank-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auraos-northflank-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/development/auraos-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: auraos-preview
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      DATABASE_URL: ${{ secrets.AURAOS_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.AURAOS_JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.AURAOS_JWT_REFRESH_SECRET }}
      AURAOS_EXPECTED_PROJECT_REF: limpprtlwtlvfwezkulq
      NORTHFLANK_API_BASE: https://api.northflank.com/v1
      NORTHFLANK_PROJECT_NAME: AuraOS Preview
      NORTHFLANK_SERVICE_NAME: AuraOS Backend

    steps:
      - name: Checkout isolated AuraOS branch
        uses: actions/checkout@v4
        with:
          ref: development/auraos-preview

      - name: Verify branch and secret identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/development/auraos-preview"
          node <<'NODE'
          const required = [
            'NORTHFLANK_API_TOKEN',
            'DATABASE_URL',
            'JWT_SECRET',
            'JWT_REFRESH_SECRET',
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }
          if (process.env.JWT_SECRET.length < 32 || process.env.JWT_REFRESH_SECRET.length < 32) {
            throw new Error('AuraOS JWT secrets must each contain at least 32 characters');
          }
          if (process.env.JWT_SECRET === process.env.JWT_REFRESH_SECRET) {
            throw new Error('AuraOS JWT secrets must be different');
          }
          const databaseUrl = new URL(process.env.DATABASE_URL);
          const identity = `${databaseUrl.hostname} ${decodeURIComponent(databaseUrl.username)}`;
          if (!identity.includes(process.env.AURAOS_EXPECTED_PROJECT_REF)) {
            throw new Error('DATABASE IDENTITY MISMATCH: refusing to deploy');
          }
          NODE

      - name: Compile backend without touching the database
        working-directory: auraos
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Provision and deploy on Northflank
        id: northflank
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const apiBase = process.env.NORTHFLANK_API_BASE;
          const token = process.env.NORTHFLANK_API_TOKEN;
          const branch = 'development/auraos-preview';
          const expectedRef = process.env.AURAOS_EXPECTED_PROJECT_REF;

          async function api(method, path, body, accepted = [200, 201, 202]) {
            const response = await fetch(`${apiBase}${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            if (!accepted.includes(response.status)) {
              throw new Error(`${method} ${path} failed with HTTP ${response.status}`);
            }
            if (response.status === 204) return {};
            return response.json();
          }

          function valuesContaining(value, suffix, found = []) {
            if (typeof value === 'string' && value.includes(suffix)) found.push(value);
            else if (Array.isArray(value)) value.forEach(item => valuesContaining(item, suffix, found));
            else if (value && typeof value === 'object') {
              Object.values(value).forEach(item => valuesContaining(item, suffix, found));
            }
            return found;
          }

          async function main() {
            const listed = await api('GET', '/projects?per_page=100');
            const visibleProjects = listed?.data?.projects || [];
            console.log('Visible Northflank projects:', visibleProjects.map(item => ({
              id: item.id,
              name: item.name,
            })));
            const projectResponse = await fetch(`${apiBase}/projects`, {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                name: process.env.NORTHFLANK_PROJECT_NAME,
                description: 'Isolated AuraOS backend preview',
                color: '#7C3AED',
                region: 'europe-west',
              }),
            });
            if (![200, 201, 202].includes(projectResponse.status)) {
              const safeProjectError = (await projectResponse.text()).slice(0, 1000);
              throw new Error(`PUT /projects failed with HTTP ${projectResponse.status}: ${safeProjectError}`);
            }
            const project = (await projectResponse.json()).data;
            console.log('Northflank project specification applied.');
            if (!project?.id) throw new Error('Northflank project ID was not returned');

            const databaseUrl = new URL(process.env.DATABASE_URL);
            databaseUrl.searchParams.set('sslmode', 'require');
            if (databaseUrl.hostname.endsWith('.pooler.supabase.com')) {
              databaseUrl.searchParams.set('uselibpqcompat', 'true');
            }
            const identity = `${databaseUrl.hostname} ${decodeURIComponent(databaseUrl.username)}`;
            if (!identity.includes(expectedRef)) {
              throw new Error('DATABASE IDENTITY MISMATCH: refusing Northflank update');
            }

            const serviceSpec = {
              name: process.env.NORTHFLANK_SERVICE_NAME,
              description: 'AuraOS backend from development/auraos-preview only',
              billing: { deploymentPlan: 'nf-compute-10' },
              deployment: {
                instances: 1,
                docker: { configType: 'default' },
                storage: { ephemeralStorage: { storageSize: 1024 } },
              },
              ports: [{
                name: 'http',
                internalPort: 3000,
                public: true,
                vpcAccessible: false,
                protocol: 'HTTP',
              }],
              buildSource: 'git',
              vcsData: {
                projectUrl: 'https://github.com/Premieros/55',
                projectType: 'github',
                projectBranch: branch,
              },
              buildSettings: {
                dockerfile: {
                  buildEngine: 'buildkit',
                  dockerFilePath: '/Dockerfile',
                  dockerWorkDir: '/auraos',
                },
              },
              buildConfiguration: {
                branchRestrictions: [branch],
                isAllowList: true,
              },
              runtimeEnvironment: {
                NODE_ENV: 'production',
                PORT: '3000',
                SUPABASE_PROJECT_REF: expectedRef,
                SUPABASE_URL: `https://${expectedRef}.supabase.co`,
                DATABASE_URL: databaseUrl.toString(),
                JWT_SECRET: process.env.JWT_SECRET,
                JWT_REFRESH_SECRET: process.env.JWT_REFRESH_SECRET,
                JWT_EXPIRES_IN: '15m',
                JWT_REFRESH_EXPIRES_IN: '7d',
                PAYMENT_GATEWAY: 'none',
                APP_URL: 'https://premieros.github.io/55/auraos-preview/',
                CORS_ORIGIN: 'https://premieros.github.io',
              },
              healthChecks: [{
                protocol: 'HTTP',
                type: 'readinessProbe',
                path: '/api/v1/health',
                port: 3000,
                initialDelaySeconds: 20,
                periodSeconds: 20,
                timeoutSeconds: 5,
                failureThreshold: 6,
                successThreshold: 1,
              }],
              autoscaling: {},
            };

            const put = await api('PUT', `/projects/${project.id}/services/combined`, serviceSpec);
            const serviceId = put?.data?.id;
            if (!serviceId) throw new Error('Northflank service ID was not returned');
            console.log('Northflank service specification applied.');

            const buildResponse = await fetch(`${apiBase}/projects/${project.id}/services/${serviceId}/build`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ sha: process.env.GITHUB_SHA }),
            });
            if (![200, 201, 202, 409].includes(buildResponse.status)) {
              throw new Error(`Build trigger failed with HTTP ${buildResponse.status}`);
            }
            console.log(buildResponse.status === 409
              ? 'A build is already queued for this service.'
              : 'Build triggered for the checked-out commit.');

            let service;
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              service = (await api('GET', `/projects/${project.id}/services/${serviceId}`)).data;
              const build = service?.status?.build?.status;
              const deployment = service?.status?.deployment?.status;
              console.log(`Status ${attempt}/60: build=${build || 'pending'}, deployment=${deployment || 'pending'}`);
              if (['FAILURE', 'CRASHED', 'ABORTED', 'SUBMISSION_FAILURE'].includes(build)) {
                throw new Error(`Northflank build ended with ${build}`);
              }
              if (deployment === 'FAILED') throw new Error('Northflank deployment failed');
              if (build === 'SUCCESS' && deployment === 'COMPLETED') break;
              if (attempt === 60) throw new Error('Timed out waiting for a healthy Northflank deployment');
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

            const domains = [...new Set(valuesContaining(service, 'code.run'))];
            const publicUrl = domains.length ? `https://${domains[0].replace(/^https?:\/\//, '')}` : '';
            if (publicUrl) {
              const healthUrl = `${publicUrl.replace(/\/$/, '')}/api/v1/health`;
              const response = await fetch(healthUrl);
              if (!response.ok) throw new Error(`Public health check failed with HTTP ${response.status}`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `service_url=${publicUrl}\n`);
            }
            const dashboardUrl = `https://app.northflank.com/s/project/${project.id}/service/${serviceId}`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `dashboard_url=${dashboardUrl}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## AuraOS Northflank deployment\n\n` +
              `- Branch: \`${branch}\`\n` +
              `- Commit: \`${process.env.GITHUB_SHA}\`\n` +
              `- Supabase project: \`${expectedRef}\`\n` +
              `- Dashboard: ${dashboardUrl}\n` +
              (publicUrl ? `- API: ${publicUrl}/api/v1\n` : '- API: available from the Northflank service page\n'));
          }

          main().catch(error => {
            console.error(`Deployment failed: ${error.message}`);
            process.exit(1);
          });
          NODE

      - name: Deployment links
        shell: bash
        env:
          SERVICE_URL: ${{ steps.northflank.outputs.service_url }}
          DASHBOARD_URL: ${{ steps.northflank.outputs.dashboard_url }}
        run: |
          set -euo pipefail
          echo "Northflank dashboard: $DASHBOARD_URL"
          if [ -n "$SERVICE_URL" ]; then
            echo "AuraOS API base: $SERVICE_URL/api/v1"
          fi
