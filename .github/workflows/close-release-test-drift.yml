name: Close Release Test Drift

on:
  workflow_dispatch:
  push:
    branches: ["development/opencode"]
    paths:
      - 'scripts/ci/close_release_test_drift.py'
      - '.github/workflows/close-release-test-drift.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/opencode
          fetch-depth: 0

      - name: Update stale integration expectations
        run: python scripts/ci/close_release_test_drift.py

      - name: Commit test contract update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/rls_branch_isolation.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No test drift changes required.'
            exit 0
          fi
          git commit -m 'test: align RLS fixtures with permission-first contract'
          git push origin HEAD:development/opencode
