name: Finalize Recipe RLS Test

on:
  push:
    branches: ["development/opencode"]
    paths:
      - '.github/workflows/finalize-recipe-rls-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/opencode
          fetch-depth: 0

      - name: Align super-admin delete expectation with canonical policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/rls_branch_isolation.test.ts')
          s = p.read_text(encoding='utf-8')
          start = s.find("          case 'permRecipes':")
          end = s.find("          case 'adminInsOnly':", start)
          if start < 0 or end < 0:
              raise SystemExit('permRecipes case not found; refusing blind patch')
          block = s[start:end]
          target = "await runProbe(client, `${ch.name} DELETE admin other`, adminId(), del(other), 'denied');"
          if target not in block:
              if "DELETE admin other" in block and "'ok'" in block:
                  raise SystemExit(0)
              raise SystemExit('target admin delete expectation not found in permRecipes case')
          block = block.replace(target, "await runProbe(client, `${ch.name} DELETE admin other`, adminId(), del(other), 'ok');", 1)
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit verified test-contract correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/rls_branch_isolation.test.ts
          if git diff --cached --quiet; then
            echo 'No change needed'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'test: align recipe delete expectation with permission-first RLS'
          git push origin HEAD:development/opencode
