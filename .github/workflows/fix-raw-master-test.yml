name: Fix Raw Master Test Contract

on:
  push:
    branches: ["development/opencode"]
    paths:
      - '.github/workflows/fix-raw-master-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/opencode
          fetch-depth: 0

      - name: Align global master-data test with branch-scoped raw materials
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/rls_branch_isolation.test.ts')
          s = p.read_text(encoding='utf-8')
          old = "for (const table of ['roles', 'measurement_units', 'raw_materials', 'branches'])"
          new = "for (const table of ['roles', 'measurement_units', 'branches'])"
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('target global master-data list not found; refusing blind patch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit test-contract correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/rls_branch_isolation.test.ts
          if git diff --cached --quiet; then
            echo 'No change required.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'test: keep raw materials branch scoped in RLS matrix'
          git push origin HEAD:development/opencode
