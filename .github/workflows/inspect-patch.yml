name: Verify uploaded patch source

on:
  push:
    branches: ["Premieros-patch-1-verify"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded source
        run: |
          rm -rf app
          mkdir -p app
          unzip -q johna-s.zip -d app
          test -f app/package.json
          test -d app/src

      - name: Apply warehouse inventory patch
        run: |
          {
            head -n -2 patches/warehouse_inventory_fix.part00
            cat patches/warehouse_inventory_fix.part01
            cat patches/warehouse_inventory_fix.part02
            cat patches/warehouse_inventory_fix.part03
            cat patches/warehouse_inventory_fix.part04
          } > /tmp/warehouse_inventory_fix.patch
          cd app
          patch --dry-run -p1 < /tmp/warehouse_inventory_fix.patch
          patch -p1 < /tmp/warehouse_inventory_fix.patch
          patch --dry-run -p1 < ../patches/warehouse_inventory_fix.part05
          patch -p1 < ../patches/warehouse_inventory_fix.part05

      - name: Verify database identity
        working-directory: app
        env:
          SUPABASE_PROJECT_REF: scpovyrqmsbiduanykod
          VITE_SUPABASE_URL: https://scpovyrqmsbiduanykod.supabase.co
        run: node scripts/db/verify-database-identity.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-save --no-audit --no-fund react-is@18.3.1

      - name: Typecheck changed inventory files
        working-directory: app
        run: |
          set +e
          npm run typecheck > ../typecheck.log 2>&1
          status=$?
          set -e
          cat ../typecheck.log
          if grep -E "src/(api/domains/inventory|features/(inventory/pages/InventoryPage|manufacturing/pages/RawMaterialsPage|trade/pages/PurchasesPage))\.tsx?|src/api/domains/inventory\.ts" ../typecheck.log | grep -q "error TS"; then
            echo "Warehouse inventory patch introduced TypeScript errors"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Full project typecheck still has pre-existing unrelated errors; changed inventory files are clean."
          fi

      - name: Build
        working-directory: app
        env:
          VITE_BASE_PATH: /55/
          VITE_SUPABASE_URL: https://scpovyrqmsbiduanykod.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_r1Qbehu-uzsQo-8vOr77OQ_Tzj6K_Jm
        run: npm run build

      - name: Upload patched source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premieros-patch-1-patched-source
          path: app/src
          if-no-files-found: error
