name: Inspect Shift Source

on:
  push:
    branches: ["fix/shift-sales-report"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract snapshot
        run: |
          rm -rf app
          mkdir -p app
          unzip -q johna-s.zip -d app
          test -f app/package.json
          test -f app/src/features/trade/services/shiftClosingReport.ts
      - name: Upload exact extracted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: shift-full-snapshot
          path: app
