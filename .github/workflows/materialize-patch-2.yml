name: Materialize Patch 2 Compatibility

on:
  workflow_dispatch:
  push:
    branches: ["Premieros-patch-2"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: materialize production-compatible unified inventory snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch uploaded snapshot for production schema compatibility
        run: |
          rm -rf app
          mkdir app
          unzip -q johna-s.zip -d app
          python - <<'PY'
          from pathlib import Path
          import json

          mig = Path('app/supabase/migrations/20260908150000_unify_warehouse_inventory_and_pos_availability.sql')
          s = mig.read_text(encoding='utf-8')
          replacements = {
              "ORDER BY r.is_default DESC NULLS LAST, r.version DESC, r.created_at DESC":
                  "ORDER BY r.version DESC, r.created_at DESC",
              "COALESCE(u.name, rm.unit, 'وحدة') AS unit_name":
                  "COALESCE(u.name, u.symbol, 'وحدة') AS unit_name",
              "iu.sku AS item_code":
                  "COALESCE(iu.sku, iu.code) AS item_code",
              "iu.base_unit AS unit_name":
                  "'وحدة'::text AS unit_name",
              "GROUP BY iub.unit_id, iu.name, iu.sku, iu.unit_type, iu.base_unit, iub.branch_id, b.name, iub.warehouse_id, w.name, iu.min_stock;":
                  "GROUP BY iub.unit_id, iu.name, iu.sku, iu.code, iu.unit_type, iub.branch_id, b.name, iub.warehouse_id, w.name, iu.min_stock;",
              "SELECT quantity FROM public.raw_material_inventory\n                  WHERE raw_material_id = v_item.raw_material_id\n                    AND branch_id = p_branch_id\n                    AND warehouse_id = p_warehouse_id":
                  "SELECT rmi.quantity FROM public.raw_material_inventory rmi\n                  WHERE rmi.raw_material_id = v_item.raw_material_id\n                    AND rmi.branch_id = p_branch_id\n                    AND rmi.warehouse_id = p_warehouse_id",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
          mig.write_text(s, encoding='utf-8')

          pkg_path = Path('app/package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg.setdefault('devDependencies', {})['@testing-library/dom'] = '^10.4.1'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert 'r.is_default' not in s
          assert 'iu.base_unit' not in s
          assert "COALESCE(u.name, u.symbol, 'وحدة') AS unit_name" in s
          assert 'COALESCE(iu.sku, iu.code) AS item_code' in s
          assert 'SELECT rmi.quantity FROM public.raw_material_inventory rmi' in s
          PY

      - name: Repack canonical snapshot
        run: |
          rm johna-s.zip
          cd app
          zip -qr ../johna-s.zip .
          cd ..

      - name: Commit materialized snapshot
        run: |
          git config user.name Premier
          git config user.email sayed3la2@gmail.com
          git add johna-s.zip
          if git diff --cached --quiet; then
            echo "No snapshot changes required"
            exit 0
          fi
          git commit -m 'fix: materialize production-compatible unified inventory snapshot'
          git push origin HEAD:Premieros-patch-2
