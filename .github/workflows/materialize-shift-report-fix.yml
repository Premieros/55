name: Materialize Shift Sales Report Fix

on:
  push:
    branches: ["fix/shift-sales-report"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip already materialized commit
        id: guard
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [ "$msg" = "fix link shift reports through shift operations" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Patch canonical snapshot
        if: steps.guard.outputs.skip != 'true'
        run: |
          rm -rf app
          mkdir -p app
          unzip -q johna-s.zip -d app
          python .github/scripts/patch_shift_report.py
          rm johna-s.zip
          cd app
          zip -qr ../johna-s.zip .
      - name: Commit fixed snapshot
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name Premier
          git config user.email sayed3la2@gmail.com
          git add johna-s.zip
          git commit -m "fix link shift reports through shift operations"
          git push origin HEAD:fix/shift-sales-report
