name: Materialize source tree

on:
  push:
    branches:
      - development/opencode
    paths:
      - '.github/workflows/materialize-source.yml'
      - 'johna-s.zip'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: development/opencode
          fetch-depth: 0

      - name: Validate archive exists
        run: |
          test -f johna-s.zip
          unzip -t johna-s.zip >/dev/null

      - name: Extract canonical source
        run: |
          rm -rf .materialized-source
          mkdir .materialized-source
          unzip -q johna-s.zip -d .materialized-source
          test -d .materialized-source/src
          test -d .materialized-source/tests
          test -d .materialized-source/supabase
          test -f .materialized-source/package.json

      - name: Materialize source into repository root
        run: |
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.materialized-source/' \
            .materialized-source/ ./
          rm -f johna-s.zip

      - name: Verify materialized source
        run: |
          test -d src
          test -d tests
          test -d supabase
          test -f package.json
          test -f src/main.tsx
          test ! -f johna-s.zip

      - name: Commit source tree
        run: |
          rm -rf .materialized-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: convert repository to source-based layout'
          git push origin HEAD:development/opencode
