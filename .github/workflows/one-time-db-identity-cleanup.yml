name: One-time database identity cleanup

on:
  push:
    branches: ["chore/lock-database-identity"]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/lock-database-identity
          fetch-depth: 0

      - name: Sanitize archive
        run: python3 scripts/one-time-db-identity-cleanup.py

      - name: Validate JavaScript identity guards
        run: |
          rm -rf .verify-db-lock
          mkdir -p .verify-db-lock
          unzip -q johna-s.zip -d .verify-db-lock
          node --check .verify-db-lock/scripts/db/verify-database-identity.js
          node --check .verify-db-lock/scripts/db/migrate-target-db.mjs
          rm -rf .verify-db-lock
          unzip -tq johna-s.zip

      - name: Commit sanitized project snapshot
        run: |
          git rm .github/workflows/one-time-db-identity-cleanup.yml
          git rm scripts/one-time-db-identity-cleanup.py
          git add johna-s.zip .env.example DATABASE_IDENTITY_LOCK.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: lock project to scpovyrqmsbiduanykod only'
          git push origin HEAD:chore/lock-database-identity
