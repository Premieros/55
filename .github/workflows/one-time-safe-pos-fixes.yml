name: One-time safe POS fixes

on:
  push:
    branches: ["feature/desktop-mobile-printing"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/desktop-mobile-printing
          fetch-depth: 0

      - name: Apply code-only fixes inside project snapshot
        run: python3 scripts/one-time-safe-pos-fixes.py

      - name: Verify archive and database freeze
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq johna-s.zip
          rm -rf .verify-safe-fixes
          mkdir .verify-safe-fixes
          unzip -q johna-s.zip -d .verify-safe-fixes
          node --check .verify-safe-fixes/electron/main.cjs
          node --check .verify-safe-fixes/electron/preload.cjs
          test ! -e .verify-safe-fixes/supabase/.git-change-marker
          ! grep -R "ais-pre-" .verify-safe-fixes/electron .verify-safe-fixes/capacitor.config.json
          grep -q "const noRecipe = false" .verify-safe-fixes/src/features/pos/components/catalog/ProductBrowser.tsx
          grep -q "setSinglePrintPolicy(isSinglePrintPolicyEnabled())" .verify-safe-fixes/src/features/pos/components/settings/PrinterSettingsPanel.tsx
          grep -q "code: 'cold'" .verify-safe-fixes/src/features/pos/components/settings/PrinterSettingsPanel.tsx
          grep -q "CLOUD_PRINT_QUEUE_ENABLED" .verify-safe-fixes/src/features/pos/services/localPrintAgent.ts
          rm -rf .verify-safe-fixes

      - name: Commit patched snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-safe-pos-fixes.yml scripts/one-time-safe-pos-fixes.py
          git add johna-s.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: POS stock availability and safe printing integration'
          git push origin HEAD:feature/desktop-mobile-printing
