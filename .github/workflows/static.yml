name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract uploaded project snapshot
        run: |
          rm -rf app
          mkdir -p app
          unzip -q johna-s.zip -d app
          test -f app/package.json
          test -d app/src

      - name: Apply reviewed source overrides
        run: |
          if [ -d overrides ]; then
            rsync -a overrides/ app/
          fi

      - name: Verify database identity
        working-directory: app
        env:
          SUPABASE_PROJECT_REF: scpovyrqmsbiduanykod
          VITE_SUPABASE_URL: https://scpovyrqmsbiduanykod.supabase.co
        run: node scripts/db/verify-database-identity.js

      - name: Install dependencies
        working-directory: app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-save --no-audit --no-fund react-is@18.3.1

      - name: Build Vite app
        working-directory: app
        env:
          VITE_BASE_PATH: /55/
          VITE_SUPABASE_URL: https://scpovyrqmsbiduanykod.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_r1Qbehu-uzsQo-8vOr77OQ_Tzj6K_Jm
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
