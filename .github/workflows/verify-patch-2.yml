name: Verify Patch 2

on:
  push:
    branches: ["Premieros-patch-2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project snapshot
        run: |
          rm -rf app
          mkdir -p app
          unzip -q johna-s.zip -d app
          test -f app/package.json
          test -d app/src
          test -f app/supabase/migrations/20260908150000_unify_warehouse_inventory_and_pos_availability.sql
          test -f app/tests/unit/warehouseInventoryUnifiedContract.test.ts

      - name: Verify migration safety contract
        working-directory: app
        run: |
          MIG="supabase/migrations/20260908150000_unify_warehouse_inventory_and_pos_availability.sql"
          grep -q "MIGRATION ABORTED" "$MIG"
          grep -q "trg_validate_warehouse_branch_integrity" "$MIG"
          grep -q "WAREHOUSE_BRANCH_MISMATCH" "$MIG"
          grep -q "w.branch_id = rmi.branch_id" "$MIG"
          grep -q "w.branch_id = rmb.branch_id" "$MIG"
          if grep -Eq "WHERE[[:space:]]+w\.is_active[[:space:]]*=[[:space:]]*true" "$MIG"; then
            echo "Unsafe cross-branch warehouse fallback detected"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-save --no-audit --no-fund react-is@18.3.1 @testing-library/dom

      - name: Verify database identity
        working-directory: app
        env:
          SUPABASE_PROJECT_REF: scpovyrqmsbiduanykod
          VITE_SUPABASE_URL: https://scpovyrqmsbiduanykod.supabase.co
        run: npm run verify:db-identity

      - name: Unified inventory regression test
        working-directory: app
        run: npx vitest run tests/unit/warehouseInventoryUnifiedContract.test.ts

      - name: Unit tests
        working-directory: app
        run: npm run test:unit

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        env:
          VITE_BASE_PATH: /55/
          VITE_SUPABASE_URL: https://scpovyrqmsbiduanykod.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_r1Qbehu-uzsQo-8vOr77OQ_Tzj6K_Jm
        run: npm run build
