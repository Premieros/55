services:
  - type: web
    name: premieros-55-auraos-api
    runtime: node
    branch: development/auraos-preview
    rootDir: auraos
    plan: free
    autoDeploy: false
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SUPER_ADMIN_EMAILS
        value: sayed3la2@gmail.com
      - key: CORS_ORIGIN
        value: https://premieros.github.io
      - key: APP_URL
        value: https://premieros.github.io/55/auraos-preview/
      - key: PAYMENT_GATEWAY
        value: none
      - key: AURAOS_EXPECTED_PROJECT_REF
        value: limpprtlwtlvfwezkulq
